name: Android release
on:
  push:
    branches: [main, 'game/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRICKSTORM_KEYSTORE_B64: ${{ secrets.BRICKSTORM_KEYSTORE_B64 }}
      BRICKSTORM_KEY_PASSWORD: ${{ secrets.BRICKSTORM_KEY_PASSWORD }}
      BRICKSTORM_KEY_ALIAS: brickstorm
      BRICKSTORM_PREVIOUS_B64: ${{ secrets.BRICKSTORM_PREVIOUS_B64 }}
      BRICKSTORM_PREVIOUS_PASSWORD: ${{ secrets.BRICKSTORM_PREVIOUS_PASSWORD }}
      BRICKSTORM_LINEAGE_B64: ${{ secrets.BRICKSTORM_LINEAGE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify campaign and wall physics
        run: bash tests/run.sh
      - name: Compile release and run Android lint
        run: gradle --no-daemon :app:compileReleaseJavaWithJavac :app:lintRelease
      - name: Assemble signed release when private signing secrets are configured
        if: env.BRICKSTORM_KEYSTORE_B64 != ''
        shell: bash
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export BRICKSTORM_KEYSTORE="$RUNNER_TEMP/brickstorm-release.jks"
          export BRICKSTORM_PREVIOUS_KEYSTORE="$RUNNER_TEMP/brickstorm-previous.jks"
          export BRICKSTORM_LINEAGE="$RUNNER_TEMP/brickstorm-lineage.bin"
          python3 - <<'PY'
          import os,base64,pathlib
          for source,dest in [('BRICKSTORM_KEYSTORE_B64','BRICKSTORM_KEYSTORE'),('BRICKSTORM_PREVIOUS_B64','BRICKSTORM_PREVIOUS_KEYSTORE'),('BRICKSTORM_LINEAGE_B64','BRICKSTORM_LINEAGE')]:
              if os.environ.get(source):
                  p=pathlib.Path(os.environ[dest]);p.write_bytes(base64.b64decode(os.environ[source]));p.chmod(0o600)
          PY
          if [ -z "$BRICKSTORM_PREVIOUS_B64" ] || [ -z "$BRICKSTORM_LINEAGE_B64" ]; then
            unset BRICKSTORM_PREVIOUS_KEYSTORE BRICKSTORM_LINEAGE
          fi
          python3 scripts/assemble-release.py
      - uses: actions/upload-artifact@v4
        if: env.BRICKSTORM_KEYSTORE_B64 != ''
        with:
          name: BrickStorm-1.8.0-release
          path: out/release/BrickStorm-1.8.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: app/build/reports/lint-results-release.html
